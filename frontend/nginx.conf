server {
    listen 4173;
    root /usr/share/nginx/html;

    # The console API, including the SSE live loop: no buffering, long read timeout.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Client-side routes (react-router) fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
