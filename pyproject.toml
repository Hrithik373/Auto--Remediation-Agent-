[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-remediate"
version = "0.1.0"
description = "Safety-gated LLM auto-remediation agent for AIOps — pre-execution verification layer + risk/autonomy evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "duckdb>=1.0",
    "prometheus-client>=0.20",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "matplotlib>=3.8",   # make eval figures (imported lazily, only by eval/figures.py)
]

[project.optional-dependencies]
# Only scripts/fetch_itbench.py needs this (one-time dataset download); the core never imports it.
data = [
    "huggingface_hub>=0.24",
]
# Only scripts/e2e_live_demo.py (`make e2e`); also run `python -m playwright install chromium`.
e2e = [
    "playwright>=1.45",
]
# Only scripts/build_report.py (`make report-pdf`): Chromium renders the report, pypdf paginates it.
report = [
    "playwright>=1.45",
    "pypdf>=4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
