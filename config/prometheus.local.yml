# Scrapes a gateway running natively on the host (docker-compose.observability.yml). The container
# version of this file, config/prometheus.yml, targets the compose `gateway` service instead.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: sentinel-gateway
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:8080"]
